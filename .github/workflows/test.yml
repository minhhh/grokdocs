name: Test
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - README.md
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/checkout@v4

      - name: Unit tests
        run: go test -tags fts5 ./...

  test-onnx:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          auto-update-conda: false

      - name: Install FAISS
        shell: bash -el {0}
        run: |
          conda install -c pytorch -c conda-forge faiss-cpu=1.14.3
          {
            echo "CGO_CFLAGS=-I$CONDA_PREFIX/include"
            echo "CGO_LDFLAGS=-L$CONDA_PREFIX/lib"
            echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Download ONNX Runtime
        run: |
          curl -sLO https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-x64-1.21.0.tgz
          tar xzf onnxruntime-linux-x64-1.21.0.tgz
          sudo cp onnxruntime-linux-x64-1.21.0/lib/libonnxruntime* /usr/local/lib/
          sudo ln -sf libonnxruntime.so /usr/local/lib/onnxruntime.so
          sudo ldconfig

      - name: Unit tests with coverage
        run: go test -tags "fts5 onnx" -coverprofile=coverage.out ./...

      - name: Process coverage report
        run: bash .github/workflows/scripts/coverage-report.sh
        env:
          INPUT_COVERAGE: coverage.out

      - name: Upload badge to Gist
        uses: popsiclestick/gist-sync-action@88f8633178625914f2a01abf1a765f7272a580fa # v1.2.0
        if: >-
          success()
          && hashFiles('coverage.svg') != ''
          && !github.event.repository.fork
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          gist_url: https://gist.github.com/minhhh/${{ secrets.GIST_ID }}
          auth: ${{ secrets.GIST_TOKEN }}
          gist_description: grokdocs coverage badge
          github_file: coverage.svg
          gist_title: coverage.svg
