name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. v0.0.1-test)"
        required: true
        default: v0.0.1-test

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            label: linux-amd64

          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            label: linux-arm64

          - os: macos-latest
            goos: darwin
            goarch: amd64
            label: darwin-amd64

          - os: macos-latest
            goos: darwin
            goarch: arm64
            label: darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update -qq
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross libfaiss-dev:arm64
            ONNX_ARCH=arm64
          else
            sudo apt-get install -y -qq gcc libc6-dev libfaiss-dev
            ONNX_ARCH=x64
          fi
          curl -sLO "https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-${ONNX_ARCH}-1.21.0.tgz"
          tar xzf "onnxruntime-linux-${ONNX_ARCH}-1.21.0.tgz"
          sudo cp "onnxruntime-linux-${ONNX_ARCH}-1.21.0/lib/libonnxruntime"* /usr/local/lib/
          sudo ldconfig

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install faiss onnxruntime
          {
            echo "CGO_CFLAGS=-I$(brew --prefix)/include"
            echo "CGO_LDFLAGS=-L$(brew --prefix)/lib"
          } >> "$GITHUB_ENV"

      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=1 \
          CC=${{ matrix.goarch == 'arm64' && matrix.goos == 'linux' && 'aarch64-linux-gnu-gcc' || 'cc' }} \
          go build -tags "fts5 onnx" \
            -ldflags "-X main.version=${{ env.VERSION }}" \
            -o "grokdocs-${{ matrix.label }}" \
            ./cmd/grokdocs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grokdocs-${{ matrix.label }}
          path: grokdocs-${{ matrix.label }}

  create-release:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: grokdocs-*
          merge-multiple: true

      - name: Generate release notes
        run: |
          awk '/^## \[/{if (found) exit; found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            grokdocs-*
